<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cabeca_div">
            <h1 class="cabeca">Loja de Carros</h1>
            <a class="cabeca_link"href="index.html">Home</a>
            <a class="cabeca_link" href="lista_carros.html">Lista de Carros</a>
            <a class="cabeca_link" href="perfil.html">Perfil</a>
            <a class="cabeca_link" href="sobre.html">Sobre Nós</a>
        </div>
    </header>
    <main>
        <div class="login_user">
            <h1 class="login">Login</h1>
            <form action="#" method="post">
                <div class="email_input">
                    <input class="email" type="text" name="email" placeholder="Digite seu email...">
                </div>
                <div class="password_input">
                    <input class="password" type="password" name="password" placeholder="Digite sua senha...">
                </div>
                <div class="checkboxes">
                    <input class="radio" type="radio" name="opcao" value="conectar">Permanecer conectado
                </div>
                <div class="login_button_div">
                    <input class="login_button" type="submit" value="Entrar">
                </div>
            </form>
        </div>
    </main>
</body>
</html>
