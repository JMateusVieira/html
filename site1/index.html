<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Carros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cabeca_div">
            <h1 class="cabeca">Loja de Carros</h1>
            <a class="cabeca_link"href="index.html">Home</a>
            <a class="cabeca_link" href="perfil.html">Perfil</a>
        </div>
    </header>
    <main>
        <h1 class="apresentacao">Bem-vindo à Loja de Carros</h1>
        <p class="apresentacao_descricao">Explore nossa coleção de carros e encontre o seu próximo veículo!</p>
        <div class="pesquisa">
            <input class="pesquisa_input" type="text" name="nome" placeholder="Procure um carro...">
        </div>
        <div class="carros_lista">
            <h2 class="carros_destaque_titulo">Carros em Destaque</h2>
                <div class="carros_destaque">
                    <a class="carro_link" href="carro.html">
                        <img src="./imagens/639_1.jpg" alt="Fiat Uno Mille">
                        <p class="carro_nome">Fiat Uno Mille</p>
                    </a>
                    <a class="carro_link" href="carro.html">
                        <img src="./imagens/capa-comparativos-2-01-e1541859116970.jpg" alt="Volkswagen Gol GTi">
                        <p class="carro_nome">Volkswagen Gol GTi</p>
                    </a>
                    <a class="carro_link" href="carro.html">
                        <img src="./imagens/fiat-marea-2.0-mpi-weekend-20v-turbo-gasolina-4p-manual-wmimagem15442578594.jpg" alt="Fiat Marea Weekend">
                        <p class="carro_nome">Fiat Marea Weekend</p>
                    </a>
                </div>
        </div>
    </main>
</body>
</html>
